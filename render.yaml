# ==========================================================
#  uniMotor - Blueprint de Render (https://render.com/docs/blueprint-spec)
#
#  Render lee este archivo al crear el servicio con "New > Blueprint" y, desde
#  entonces, vuelve a construir y desplegar la imagen en cada push a la rama elegida.
#  Las variables con "sync: false" se piden en el panel al crear el Blueprint
#  (no se guardan en el repositorio). Ver la seccion "Demo publicada" del README.
# ==========================================================
services:
  - type: web
    name: unimotor
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /proyecto-web/api/marcas
    envVars:
      # Base de datos MySQL (TiDB Cloud Starter, compatible con MySQL): datos del boton
      # "Connect" de la instancia (Public / General). El usuario lleva el prefijo, p. ej. "xxxx.root"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: unimotor
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: REQUIRED
      # Sin correo: el plan gratuito de Render bloquea el SMTP saliente (puertos 25, 465 y 587).
      # Sin MAIL_HOST la aplicacion simula los correos (los escribe en el log). Con un plan de pago
      # o un SMTP en otro puerto, agregar MAIL_HOST, MAIL_PORT, MAIL_USER y MAIL_PASSWORD.
      # Memoria maxima de Java dentro de los 512 MB del plan gratuito
      - key: JAVA_XMX
        value: 320m
