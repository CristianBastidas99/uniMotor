<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	template="/WEB-INF/template.xhtml">

	<ui:define name="titulo">Recuperar contraseña</ui:define>

	<ui:define name="contenido">
		<h1 class="pagina-titulo">Recuperar contraseña</h1>

		<div class="formulario-centrado">
			<h:form id="formRecuperar">
				<p:panel header="Contraseña temporal">
					<p>Escribe el correo con el que te registraste y te enviaremos una contraseña temporal.
						Después de entrar, cambia la contraseña desde tu perfil.</p>
					<div class="campo">
						<p:outputLabel for="email" value="Correo electrónico" />
						<p:inputText id="email" value="#{recuperarPasswordBean.email}" label="Correo electrónico"
							required="true" requiredMessage="El correo electrónico es obligatorio."
							validatorMessage="Ingresa un correo electrónico válido."
							pt:type="email" pt:autocomplete="username">
							<f:validateRegex pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$" />
						</p:inputText>
						<p:message for="email" />
					</div>
					<div class="acciones-formulario">
						<p:commandButton id="botonEnviar" value="Enviar contraseña temporal" icon="fa fa-envelope"
							action="#{recuperarPasswordBean.recuperar}" ajax="false" />
					</div>
					<p:defaultCommand target="botonEnviar" />
					<div class="enlaces-formulario">
						<h:link outcome="/login" value="Volver a iniciar sesión" />
					</div>
				</p:panel>
			</h:form>
		</div>
	</ui:define>
</ui:composition>
