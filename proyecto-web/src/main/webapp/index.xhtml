<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/template.xhtml">

	<ui:define name="titulo">Inicio</ui:define>

	<ui:define name="contenido">
		<section class="hero">
			<h1>Encuentre su próximo vehículo</h1>
			<p>Compre y venda carros, motos y camionetas nuevos y usados en toda Colombia.</p>
			<ui:include src="/WEB-INF/includes/buscador.xhtml"/>
		</section>

		<section class="seccion-top">
			<h2>Los 10 más buscados — Nuevos</h2>
			<h:panelGroup rendered="#{empty inicioBean.topNuevos}">
				<p class="texto-suave">Aún no hay vehículos nuevos publicados.</p>
			</h:panelGroup>
			<div class="rejilla-top">
				<ui:repeat value="#{inicioBean.topNuevos}" var="v" varStatus="estado">
					<div class="elemento-top">
						<span class="posicion-top">#{estado.index + 1}</span>
						<ui:include src="/WEB-INF/includes/tarjetaVehiculo.xhtml">
							<ui:param name="vehiculo" value="#{v}"/>
						</ui:include>
					</div>
				</ui:repeat>
			</div>
		</section>

		<section class="seccion-top">
			<h2>Los 10 más buscados — Usados</h2>
			<h:panelGroup rendered="#{empty inicioBean.topUsados}">
				<p class="texto-suave">Aún no hay vehículos usados publicados.</p>
			</h:panelGroup>
			<div class="rejilla-top">
				<ui:repeat value="#{inicioBean.topUsados}" var="v" varStatus="estado">
					<div class="elemento-top">
						<span class="posicion-top">#{estado.index + 1}</span>
						<ui:include src="/WEB-INF/includes/tarjetaVehiculo.xhtml">
							<ui:param name="vehiculo" value="#{v}"/>
						</ui:include>
					</div>
				</ui:repeat>
			</div>
		</section>
	</ui:define>
</ui:composition>
