<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/template.xhtml">

	<ui:define name="titulo">Inicio</ui:define>

	<ui:define name="contenido">
		<h1 class="pagina-titulo">uniMotor — compra y venta de vehículos</h1>

		<p:panel header="Bienvenido" styleClass="texto-centro">
			<p>La aplicación web está funcionando con JSF 2.3 y PrimeFaces 8.</p>
			<p:button value="Ver vehículos" icon="fa fa-car" outcome="/resultados"/>
		</p:panel>

		<h2 style="margin-top: 24px;">Vehículo de ejemplo</h2>
		<div class="tarjeta-vehiculo">
			<img src="#{request.contextPath}/fotos/carro-01.jpg" alt="Foto del vehículo"
				onerror="this.onerror=null;this.src='#{resource['img:sin-foto.svg']}';"/>
			<div class="cuerpo">
				<div class="titulo">Vehículo de prueba</div>
				<div class="precio">$ 0</div>
			</div>
		</div>
	</ui:define>
</ui:composition>
