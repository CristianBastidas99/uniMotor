<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	template="/WEB-INF/template.xhtml">

	<f:metadata>
		<f:viewParam name="origen" value="#{seguridadBean.origen}" />
	</f:metadata>

	<ui:define name="titulo">Iniciar sesión</ui:define>

	<ui:define name="contenido">
		<h1 class="pagina-titulo">Iniciar sesión</h1>

		<h:panelGroup layout="block" styleClass="formulario-centrado" rendered="#{seguridadBean.autenticado}">
			<p>
				<i class="fa fa-info-circle"></i>
				Ya iniciaste sesión. <h:link outcome="/index" value="Ir al inicio" />
			</p>
		</h:panelGroup>

		<h:panelGroup layout="block" styleClass="formulario-centrado" rendered="#{not seguridadBean.autenticado}">
			<h:form id="formLogin">
				<p:panel header="Acceso de clientes">
					<div class="campo">
						<p:outputLabel for="email" value="Correo electrónico" />
						<p:inputText id="email" value="#{seguridadBean.email}" label="Correo electrónico"
							required="true" requiredMessage="El correo electrónico es obligatorio."
							validatorMessage="Ingresa un correo electrónico válido."
							pt:type="email" pt:autocomplete="username">
							<f:validateRegex pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$" />
						</p:inputText>
						<p:message for="email" />
					</div>
					<div class="campo">
						<p:outputLabel for="password" value="Contraseña" />
						<p:password id="password" value="#{seguridadBean.password}" label="Contraseña"
							required="true" requiredMessage="La contraseña es obligatoria."
							feedback="false" pt:autocomplete="current-password" />
						<p:message for="password" />
					</div>
					<div class="acciones-formulario">
						<p:commandButton id="botonLogin" value="Iniciar sesión" icon="fa fa-sign-in"
							action="#{seguridadBean.iniciarSesion}" ajax="false" />
					</div>
					<p:defaultCommand target="botonLogin" />
					<div class="enlaces-formulario">
						<h:link outcome="/recuperarPassword" value="¿Olvidaste tu contraseña?" />
						<br />
						<h:link outcome="/registro" value="¿No tienes cuenta? Regístrate" />
					</div>
				</p:panel>
			</h:form>
		</h:panelGroup>
	</ui:define>
</ui:composition>
