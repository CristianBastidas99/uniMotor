<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title><ui:insert name="titulo">uniMotor</ui:insert> | uniMotor</title>
	<!-- estilos.css al final (facet "last" de PrimeFaces) para que gane sobre theme.css y components.css -->
	<f:facet name="last">
		<link rel="stylesheet" href="#{resource['css:estilos.css']}"/>
	</f:facet>
	<ui:insert name="head"/>
</h:head>
<h:body styleClass="pagina">
	<header class="encabezado">
		<div class="contenedor">
			<h:link outcome="/index" styleClass="logo-enlace">
				<h:graphicImage library="img" name="logo.svg" alt="uniMotor"/>
			</h:link>
			<h:form id="formMenu" styleClass="menu-principal">
				<p:menubar>
					<p:menuitem value="Inicio" outcome="/index" icon="fa fa-home"
						styleClass="#{view.viewId eq '/index.xhtml' ? 'opcion-activa' : ''}"/>
					<p:menuitem value="Buscar vehículos" outcome="/resultados" icon="fa fa-search"
						styleClass="#{view.viewId eq '/resultados.xhtml' ? 'opcion-activa' : ''}"/>

					<p:menuitem value="Iniciar sesión" outcome="/login" icon="fa fa-sign-in"
						rendered="#{!seguridadBean.autenticado}"
						styleClass="#{view.viewId eq '/login.xhtml' ? 'opcion-activa' : ''}"/>
					<p:menuitem value="Registrarse" outcome="/registro" icon="fa fa-user-plus"
						rendered="#{!seguridadBean.autenticado}"
						styleClass="#{view.viewId eq '/registro.xhtml' ? 'opcion-activa' : ''}"/>

					<p:menuitem value="Publicar" outcome="/usuario/publicarVehiculo" icon="fa fa-plus-circle"
						rendered="#{seguridadBean.autenticado}"
						styleClass="#{view.viewId eq '/usuario/publicarVehiculo.xhtml' ? 'opcion-activa' : ''}"/>
					<p:menuitem value="Mis vehículos" outcome="/usuario/misVehiculos" icon="fa fa-car"
						rendered="#{seguridadBean.autenticado}"
						styleClass="#{view.viewId eq '/usuario/misVehiculos.xhtml' ? 'opcion-activa' : ''}"/>
					<p:menuitem value="Favoritos" outcome="/usuario/favoritos" icon="fa fa-heart"
						rendered="#{seguridadBean.autenticado}"
						styleClass="#{view.viewId eq '/usuario/favoritos.xhtml' ? 'opcion-activa' : ''}"/>
					<p:menuitem value="Preguntas" outcome="/usuario/preguntas" icon="fa fa-comments"
						rendered="#{seguridadBean.autenticado}"
						styleClass="#{view.viewId eq '/usuario/preguntas.xhtml' ? 'opcion-activa' : ''}"/>
					<p:submenu label="#{seguridadBean.cliente.nombre_completo}" icon="fa fa-user"
						rendered="#{seguridadBean.autenticado}">
						<p:menuitem value="Mi perfil" outcome="/usuario/perfil" icon="fa fa-id-card"/>
						<p:menuitem value="Mis compras" outcome="/usuario/compras" icon="fa fa-shopping-bag"/>
						<p:menuitem value="Cerrar sesión" action="#{seguridadBean.cerrarSesion}"
							icon="fa fa-sign-out" ajax="false"/>
					</p:submenu>
				</p:menubar>
			</h:form>
		</div>
	</header>

	<main class="contenedor contenido-principal">
		<ui:insert name="contenido"/>
	</main>

	<!-- globalOnly: los errores de campo ya los muestra cada p:message; el growl solo muestra los mensajes globales -->
	<!-- redisplay=false: no repetir mensajes que la página ya mostró en su propio p:messages -->
	<p:growl id="growl" showDetail="true" life="6000" globalOnly="true" redisplay="false">
		<p:autoUpdate/>
	</p:growl>

	<footer class="pie">
		<div class="contenedor">uniMotor — Universidad del Quindío · 2026</div>
	</footer>
</h:body>
</html>
