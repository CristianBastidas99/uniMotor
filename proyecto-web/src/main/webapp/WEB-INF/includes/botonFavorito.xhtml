<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
	<!-- Sin sesión: enlace al login con regreso. Con sesión: botón AJAX. Si es propio o no disponible no se muestra. -->
	<h:form id="formFavorito" styleClass="form-favorito">
		<p:button value="Guardar en favoritos" icon="fa fa-heart-o" styleClass="boton-favorito"
			href="#{favoritoBean.urlLogin}"
			rendered="#{!seguridadBean.autenticado}"/>
		<p:commandButton id="botonFavorito" widgetVar="botonFavoritoW"
			value="#{favoritoBean.favorito ? 'En favoritos' : 'Guardar en favoritos'}"
			icon="#{favoritoBean.favorito ? 'fa fa-heart' : 'fa fa-heart-o'}"
			styleClass="boton-favorito #{favoritoBean.favorito ? 'activo' : ''}"
			action="#{favoritoBean.alternar}" process="@this" update="@form"
			onstart="PF('botonFavoritoW').disable()" oncomplete="PF('botonFavoritoW').enable()"
			rendered="#{seguridadBean.autenticado and !detalleVehiculoBean.propio and detalleVehiculoBean.disponible}"/>
	</h:form>
</ui:composition>
